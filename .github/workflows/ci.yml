name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-trixie
        env:
          POSTGRES_DB: support_pilot_test
          POSTGRES_USER: support_pilot
          POSTGRES_PASSWORD: support_pilot
        ports:
          - 54330:5432
        options: >-
          --health-cmd "pg_isready -U support_pilot -d support_pilot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      SUPPORT_PILOT_DATABASE_URL: postgresql+psycopg://support_pilot:support_pilot@localhost:54330/support_pilot_test
      SUPPORT_PILOT_TEST_DATABASE_URL: postgresql+psycopg://support_pilot:support_pilot@localhost:54330/support_pilot_test
      SUPPORT_PILOT_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest --cov=support_pilot --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose build api frontend
